<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Émargement – Contrôle de présence</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:24px;color:#222}
.card{max-width:480px;margin:40px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 4px 18px #0002}
h1{font-size:24px;margin-top:0}
p{line-height:1.5}
button,a.btn{display:block;width:100%;box-sizing:border-box;padding:15px;border:0;border-radius:10px;font-size:17px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer;background:#222;color:white}
#status{margin-top:18px;padding:14px;border-radius:10px;display:none}
.ok{background:#e8f5e9}.bad{background:#ffebee}.info{background:#eef3f8}
.small{font-size:13px;color:#666;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<h1>Émargement</h1>
<p>Pour confirmer votre présence sur le site, autorisez ponctuellement l'accès à votre position.</p>
<button id="check">Vérifier ma présence</button>
<div id="status"></div>
<div id="go" style="display:none;margin-top:14px">
<a class="btn" href="https://tally.so/r/81BMvk">Accéder à l'émargement</a>
</div>
<p class="small">La position est utilisée uniquement pour vérifier la proximité du site au moment de cette demande. Cette page ne suit pas vos déplacements.</p>
</div>

<script>
// Identifiant unique de ce navigateur/appareil
let deviceId = localStorage.getItem("emargement_device_id");

if (!deviceId) {
  deviceId = crypto.randomUUID();
  localStorage.setItem("emargement_device_id", deviceId);
}

console.log("Identifiant appareil :", deviceId);

// Coordonnées du 84 boulevard du Montparnasse, 75014 Paris
const SITE_LAT = 48.84302;
const SITE_LON = 2.32634;

// TEMPORAIRE POUR TEST À DOMICILE
const MAX_DISTANCE_M = 10000;

// Précision GPS maximale acceptée
const MAX_ACCURACY_M = 10000;

function distanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;

  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function show(text, cls) {
  const s = document.getElementById("status");
  s.style.display = "block";
  s.className = cls;
  s.textContent = text;
}

document.getElementById("check").onclick = () => {

  document.getElementById("go").style.display = "none";

  if (!navigator.geolocation) {
    show(
      "La géolocalisation n'est pas disponible sur cet appareil.",
      "bad"
    );
    return;
  }

  show("Localisation en cours…", "info");

  navigator.geolocation.getCurrentPosition(

    pos => {

      const accuracy = pos.coords.accuracy;

      const d = distanceM(
        pos.coords.latitude,
        pos.coords.longitude,
        SITE_LAT,
        SITE_LON
      );

      if (accuracy > MAX_ACCURACY_M) {

        show(
          "Position trop imprécise (" +
          Math.round(accuracy) +
          " m). Activez la localisation précise puis réessayez.",
          "bad"
        );

        return;
      }

      if (d <= MAX_DISTANCE_M) {

        show(
          "Présence sur site confirmée. Distance estimée : " +
          Math.round(d) +
          " m.",
          "ok"
        );

        const go = document.getElementById("go");

        // Envoi automatique du Device ID vers Tally
        go.href =
          "https://tally.so/r/81BMvk?device_id=" +
          encodeURIComponent(deviceId);

        go.style.display = "block";

      } else {

        show(
          "Émargement impossible : vous êtes à environ " +
          Math.round(d) +
          " m du site.",
          "bad"
        );
      }
    },

    err => {

      let msg = "Impossible d'obtenir votre position.";

      if (err.code === 1)
        msg = "Vous devez autoriser la localisation pour émarger.";

      if (err.code === 2)
        msg = "Position indisponible. Vérifiez que la localisation du téléphone est activée.";

      if (err.code === 3)
        msg = "La localisation a pris trop de temps. Réessayez.";

      show(msg, "bad");
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
};
</script>
</body>
</html>
